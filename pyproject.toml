[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mercadopago-service"
version = "0.1.0"
description = "Reusable Mercado Pago Checkout Pro integration service"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.9",
    "pip-tools>=7.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mercadopago_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py311"
