name: ci

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payments_test
      PAYMENTS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payments_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payments_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: pip install -e ".[dev]"
      - name: Apply migrations to disposable PostgreSQL
        run: python -m mercadopago_service.migrate
      - run: ruff check src tests
      - run: pytest
      - run: pip-audit
